    <div class="modal__midia">
      <img id="modal-imagem" src="" alt="">
      <a id="modal-play" class="play" href="#" target="_blank" rel="noopener noreferrer" aria-label="Assistir ao vídeo" hidden></a>
    </div>

    <p class="modal__tipo" id="modal-tipo"></p>
    <h2 id="modal-titulo"></h2>
    <p class="modal__autor" id="modal-autor"></p>

    <h3>Sobre a Obra:</h3>
    <p id="modal-descricao" class="modal__texto"></p>
    <dl id="modal-detalhes" class="modal__detalhes" hidden></dl>

</div>
