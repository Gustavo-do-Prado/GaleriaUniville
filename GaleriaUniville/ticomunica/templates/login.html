{% extends "base.html" %}
{% block titulo %}Entrar · Galeria Univille{% endblock %}

{% block conteudo %}
<form class="login" method="post" action="{{ url_for('login') }}">
  <h1>Entrar</h1>
  <p class="login__sub">Acesse a sua conta de artista para editar o perfil e publicar obras.</p>

  {% if erro %}<ul class="erros" role="alert"><li>{{ erro }}</li></ul>{% endif %}

  <input type="hidden" name="next" value="{{ proximo }}">

  <label class="campo">
    <span>E-mail</span>
    <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
  </label>
  <label class="campo">
    <span>Senha</span>
    <input type="password" name="senha" autocomplete="current-password" required>
  </label>

  <button type="submit" class="botao-escuro">ENTRAR</button>
  <p class="login__rodape">Ainda não tem conta? <a class="link-seta" href="{{ url_for('cadastro') }}">Cadastre-se →</a></p>
</form>
{% endblock %}
